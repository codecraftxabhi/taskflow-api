spring:
  application:
    name: taskflow-api
  datasource:
    url: jdbc:h2:mem:taskflow;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: 8080
